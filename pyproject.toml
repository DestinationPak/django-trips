[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-trips"
dynamic = ["version"]
description = "A Django Rest API for fetching and creating trips and their schedules."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Awais Jibran", email = "awaisdar001@gmail.com" }]
requires-python = ">=3.11"
keywords = ["django", "trips", "rest", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2,<6.0",
    "django-crum>=0.7.9",
    "django-config-models>=2.7.0",
    "django-countries>=7.6.1",
    "django-extensions>=3.2.3",
    "django-filter>=23.2",
    "django-taggit>=6.1.0",
    "djangorestframework>=3.16,<3.19",
    "djangorestframework_simplejwt>=5.5.0",
    "drf-spectacular>=0.28.0",
    "swapper>=1.3.0",
    "Pillow>=10.0.0",
    "PyJWT>=2.9.0",
    "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/DestinationPak/django-trips"
Changelog = "https://github.com/DestinationPak/django-trips/blob/master/CHANGELOG.md"
Issues = "https://github.com/DestinationPak/django-trips/issues"
Source = "https://github.com/DestinationPak/django-trips"

[project.optional-dependencies]
dev = [
    "ddt==1.7.2",
    "factory-boy>=3.3",
    "Faker",
    "pytest>=7.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.0",
    "pylint>=2.0",
    "pylint-django>=2.5.0",
    "pylint-plugin-utils",
    "isort",
    "pre-commit",
    "build",
    "twine",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo",
]

[tool.setuptools]
# PEP 621 metadata defaults this to true, which (combined with
# setuptools-scm's git-file-finder) sweeps every git-tracked file under a
# found package's directory tree into the wheel as "package data" -
# including django_trips/api/tests/* and django_trips/management/tests/*,
# bypassing packages.find's exclude below entirely. This package ships no
# non-Python data files, so opting out is correct, not just a workaround.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_trips*"]
# django_trips.tests ships deliberately - django_trips/tests/factories.py
# is a documented, consumer-facing fixture builder that django_hotels and
# django_rentals both mirror (see CLAUDE.md/README). django_trips.api.tests
# and django_trips.management.tests are this package's own internal test
# suites and aren't part of the public surface, so they're excluded.
exclude = [
    "django_trips.api.tests",
    "django_trips.api.tests.*",
    "django_trips.management.tests",
    "django_trips.management.tests.*",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.coverage.run]
source = ["django_trips"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
]

[tool.coverage.report]
show_missing = true
